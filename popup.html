<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liliana Web Pet</title>
    <style>
        body {
            margin: 0;
            padding: 12px;
            width: 200px;
          
          
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 13px;
            color: #1f2937;
            background: #f9fafb;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 14px;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 6px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #ffffff;
            color: #111827;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }
        .form {
          width: 200px;
          height: auto;
          display: flex;
          flex-direction: column;
          background-color: lightblue;
          color: black;
          border-radius: 5px;
          padding: 5px;
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 13px;
          color: #1f2937;
        }
        button:hover {
            background: #f3f4f6;
        }

        button:last-of-type {
            margin-bottom: 0;
        }
       
    </style>
</head>
<body>
   <div class="form" >
    <h1>Liliana Web Pet</h1>
    <button id="toggle-pet" type="button">Ẩn / Hiện Liliana</button>
    <button id="summon-pet" type="button">Gọi Liliana</button>
    <button id="toggle-sit" type="button">Đứng / Ngồi</button>
      
    <script src="popup.js"></script>
   </div>
</body>
</html>
